site_name: Le Chaps
site_url: https://www.lechaps.com/
site_dir: public

#repo_name: Lechaps on Github 
#repo_url: https://github.com/lechaps/lechaps

theme:
  name: material
  language: fr
  icon:
    logo: fontawesome/solid/book-open
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Nunito
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.footer
    - header.autohide
    - toc.follow
    #- toc.integrate
    #- navigation.expand

copyright: 'Version : MF 158'

plugins:
  - search
  - awesome-pages
  - graph:
      name: title
  - backlinks_section:
      title: Pages liées
      description: "Les pages suivantes font référence à cette page :"
      description_no_links: "Aucune autre page ne fait référence à cette page."
      add_to_toc: false
      hide_if_empty: true
  - privacy
  - social
  - glightbox
  - rss:
      match_path: ".*"
      use_git: true
  - minify:
      minify_html: true

not_in_nav: |
  /index.md
  /jeux/*
  bourbonnais/book-preface.md

extra:
  #generator: false
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://www.twitter.com/lechaps
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/lechaps03
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/romainchapon
    - icon: fontawesome/brands/github
      link: https://github.com/lechaps

extra_javascript:
  - js/matomo.js

markdown_extensions:
  - tables
  - footnotes
  - attr_list
